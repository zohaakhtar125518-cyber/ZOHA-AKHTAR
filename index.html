  
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Smart Earner's</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 25px 14px;
  display: grid;
  place-items: center;
  font-family: Arial, sans-serif;
  color: #eef7ff;
  background:
    radial-gradient(ellipse at top left, #28264e, transparent 50%),
    linear-gradient(135deg, #14233f, #07101f, #10243b);
}

.card {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  width: 100%;
  max-width: 620px;
  padding: 55px 35px 40px;
  text-align: center;
  border: 1px solid #173a4b;
  border-radius: 45px;
  background: linear-gradient(150deg, #0b2030, #040a17 75%);
  box-shadow: 0 20px 60px #0008;
}

.card::before,
.card::after {
  content: "";
  position: absolute;
  z-index: -1;
  width: 200px;
  height: 600px;
  border: 2px solid #6253b980;
  transform: rotate(24deg);
  pointer-events: none;
}

.card::before {
  top: -200px;
  left: -130px;
}

.card::after {
  bottom: -280px;
  right: -140px;
  border-color: #25e5f555;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  padding: 15px 22px;
  border: 1px solid #25e5f566;
  border-radius: 50px;
  color: #32e4f4;
  background: #0b536322;
  font-size: 17px;
  font-weight: bold;
  letter-spacing: 2px;
}

.dot {
  width: 10px;
  height: 10px;
  flex-shrink: 0;
  border-radius: 50%;
  background: #25e5f5;
  box-shadow: 0 0 15px #25e5f5;
}

h1 {
  margin: 60px 0 0;
  font-size: clamp(48px, 10vw, 82px);
  line-height: 1.08;
  letter-spacing: -2px;
}

h1 span {
  display: block;
}

.gradient {
  white-space: nowrap;
  background: linear-gradient(90deg, #25e5f5, #3989ff, #955cff);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.subtitle {
  margin-top: 45px;
  color: #c6ddf6;
  font-size: clamp(18px, 4vw, 25px);
}

.divider {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 22px;
  margin: 65px auto;
  max-width: 270px;
}

.line {
  height: 1px;
  flex: 1;
  background: linear-gradient(90deg, transparent, #25e5f5);
}

.line:last-child {
  background: linear-gradient(90deg, #8058ff, transparent);
}

.star {
  color: #25e5f5;
  font-size: 30px;
  text-shadow: 0 0 20px #25e5f5;
}

h2 {
  margin: 0;
  font-size: clamp(30px, 6vw, 46px);
  font-weight: 800;
}

.supporting {
  margin-top: 30px;
  color: #91a7c8;
  font-size: clamp(16px, 4vw, 22px);
  line-height: 1.5;
}

.telegram {
  width: 100%;
  min-height: 85px;
  margin-top: 45px;
  padding: 20px 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  border-radius: 27px;
  background: linear-gradient(100deg, #25e5f5, #3989ff, #8b5bff);
  box-shadow: 0 12px 35px #655aff55;
  color: #061326;
  font-size: clamp(19px, 4.5vw, 27px);
  font-weight: bold;
  text-decoration: none;
  transition: 0.2s;
}

.telegram:hover {
  transform: translateY(-3px);
  filter: brightness(1.08);
}

.telegram:active {
  transform: scale(0.98);
}

.telegram svg {
  width: 30px;
  height: 30px;
  flex-shrink: 0;
}

.footer {
  margin-top: 38px;
  color: #627795;
  font-size: 15px;
}

@media (max-width: 480px) {
  .card {
    padding: 42px 22px 35px;
    border-radius: 35px;
  }

  .brand {
    padding: 12px 15px;
    font-size: 13px;
    letter-spacing: 1.5px;
  }

  h1 {
    margin-top: 42px;
  }

  .subtitle {
    margin-top: 32px;
  }

  .divider {
    margin: 48px auto;
  }

  .telegram {
    min-height: 72px;
    margin-top: 35px;
    border-radius: 22px;
  }

  .footer {
    font-size: 13px;
  }
}
</style>
</head>

<body>
<main class="card">

  <div class="brand">
    <span class="dot"></span>
    THE SMART EARNER'S
  </div>

  <h1>
    <span>Zero</span>
    <span class="gradient">Investment</span>
    <span>Work</span>
  </h1>

  <p class="subtitle">🔥 A Refined Skill Set</p>

  <div class="divider">
    <span class="line"></span>
    <span class="star">✦</span>
    <span class="line"></span>
  </div>

  <h2>WANNA LEARN?</h2>

  <p class="supporting">
    Then click on the below link 👇
  </p>

  <a
    class="telegram"
    href="https://t.me/ZOHAAKHTAR?text=I%27m%20interested"
    target="_blank"
    rel="noopener noreferrer">

    <svg viewBox="0 0 24 24" fill="currentColor"
         aria-hidden="true">
      <path d="M21.7 4.35 18.6 19c-.23 1.03-.84 1.28-1.7.8l-4.7-3.46-2.27 2.19c-.25.25-.46.46-.94.46l.34-4.78 8.7-7.86c.38-.34-.08-.53-.59-.19L6.69 13.1 2.08 11.66c-1-.31-1.02-1 .21-1.49L20.32 3.2c.83-.3 1.56.2 1.38 1.15Z"/>
    </svg>

    <span>Telegram Now</span>
  </a>

  <div class="footer">
    The Smart Earner's · Official Community
  </div>

</main>
</body>
</html>
